name: Comment region quota budget

# pull_request workflows from forks intentionally receive a read-only token.
# This second workflow runs trusted code from the default branch and only reads
# the first workflow's text artifact; it never checks out or executes fork code.
on:
  workflow_run:
    workflows: ["Quality and performance"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download quota report
        uses: actions/download-artifact@v4
        with:
          name: region-quota-budget
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The destination comes from the RUN's metadata, never from the artifact.
      # It used to be read from a pr-number.txt built by the pull_request job,
      # i.e. from code the fork controls: a PR could pick which pull request
      # this privileged workflow (pull-requests: write) commented on, and
      # publish whatever it liked there signed by github-actions[bot].
      - name: Resolve the originating PR from trusted metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO_EVENTO: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO_ORIGEN: ${{ github.event.workflow_run.head_repository.full_name }}
          RAMA_ORIGEN: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          numero="$NUMERO_EVENTO"
          # For PRs from a fork the event carries an empty list, so the PR is
          # looked up by its HEAD — the fork and branch this very run came from,
          # both trusted metadata.
          #
          # Not by commit: `commits/<sha>/pulls` answers with every PR the commit
          # belongs to, and a fork can push a commit that already heads someone
          # else's PR, so `first` could land the comment on a stranger's. A head
          # of `<fork>:<branch>` can only ever match the PR opened from it.
          # Requiring EXACTLY ONE match keeps that guarantee: no match or an
          # ambiguous one comments nowhere.
          if [ -z "$numero" ]; then
            coincidencias=$(gh api \
              "repos/${{ github.repository }}/pulls?state=open&head=${REPO_ORIGEN%%/*}:${RAMA_ORIGEN}&per_page=100" \
              --jq "[.[] | select(.head.sha == \"$SHA\" and .head.repo.full_name == \"$REPO_ORIGEN\") | .number]")
            if [ "$(echo "$coincidencias" | jq 'length')" = "1" ]; then
              numero=$(echo "$coincidencias" | jq -r '.[0]')
            else
              echo "PR de origen no identificable sin ambigüedad ($coincidencias); no se comenta." >&2
            fi
          fi
          if [ -z "$numero" ]; then
            echo "No open PR for $SHA; nothing to comment on."
          fi
          echo "numero=$numero" >> "$GITHUB_OUTPUT"
      - name: Comment on the originating PR
        if: steps.pr.outputs.numero != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The body is still text produced by the PR's own code, so it says so:
        # a comment signed by github-actions[bot] must not be readable as a
        # verdict from the maintainers when the PR wrote it.
        run: |
          set -euo pipefail
          {
            echo "> Generated by \`quota:budget\` from this pull request's own code."
            echo
            head -c 60000 report/budget.md
          } > comment.md
          gh pr comment "${{ steps.pr.outputs.numero }}" --repo "${{ github.repository }}" --body-file comment.md
