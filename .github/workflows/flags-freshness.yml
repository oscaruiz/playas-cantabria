name: Flags freshness

# Vigila que la cadena de entrega de banderas siga viva.
#
# Vive APARTE de scrape-flags.yml a propósito. Antes era un job dentro de él, y
# eso lo dejaba ciego justo cuando más falta hacía: si GitHub descartaba el
# disparo programado —cosa que hace a menudo, de 9 pasadas al día se ejecutan
# 3–5— no corría el scrape y tampoco el vigilante. Un centinela que solo se
# despierta cuando se despierta el vigilado no puede avisar de que no se
# despertó.
#
# Separados, hacen falta DOS disparos independientes para quedarse a oscuras, y
# eso es mucho menos probable que uno.

on:
  schedule:
    # 12:00 y 16:00 UTC = 14:00 y 18:00 Madrid en verano: bien entrada la franja
    # de vigilancia (11:30–19:30) y con el izado hecho hace horas. Se comprueba
    # CUANDO la frescura debe existir, en vez de tolerar el peor caso a todas
    # horas: eso es lo que permite exigir las mismas 8 h que exige la app.
    - cron: '0 12,16 * * *'
  workflow_dispatch: {}

jobs:
  frescura:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # `main`, no el SHA del disparo: lo que se mide es la frescura de las
          # banderas publicadas ahora, no las de cuando se programó esta pasada.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run flags:freshness

  # Un cron en rojo no avisa a nadie: del 14 al 16-ago-2026 este vigilante falló
  # seis veces seguidas y la única señal que llegó fue la app sin banderas.
  avisar:
    needs: frescura
    if: failure()
    uses: ./.github/workflows/alerta-issue.yml
    permissions:
      issues: write
    with:
      titulo: 'Banderas: la cadena de entrega está caída'
      cuerpo: |
        `flags-freshness` ha fallado: el `flags.json` publicado en `main` es más viejo
        que las 8 h que la app tolera antes de ocultar el color, así que **ahora mismo
        la web no está enseñando banderas**.

        Dónde mirar, por orden:
        1. **`regions/<region>/flags-diag.json`** en `main`. Lo escribe cada pasada y
           dice qué contestaron las fichas: `conColor: 0` con `alts` lleno de
           «No hay información» significa que el sitio contestó pero sin banderas, y
           no que no hayamos podido llegar.
        2. Las últimas pasadas de **Scrape Cruz Roja flags**: salir en verde sin
           commitear `flags.json` es lo esperado cuando no hay nada izado.
        3. `npm run scrape:flags` en local, para ver si contesta distinto desde otra
           conexión.

  # El mismo aviso se apaga solo cuando la frescura vuelve. Cerrar al recuperarse
  # la frescura —y no al recuperarse el scraper— es deliberado: lo que se vigila
  # es que la app enseñe banderas, no que un job concreto termine bien.
  cerrar-aviso:
    needs: frescura
    if: success()
    uses: ./.github/workflows/alerta-issue.yml
    permissions:
      issues: write
    with:
      titulo: 'Banderas: la cadena de entrega está caída'
      accion: cerrar
      cuerpo: 'La frescura vuelve a estar dentro del límite: las banderas se están entregando.'
