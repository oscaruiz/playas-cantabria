name: Scrape Cruz Roja flags

# Scrapea las banderas de Cruz Roja desde el runner de GitHub y commitea
# regions/cantabria/flags.json, que el backend sirve como fuente primaria.
# Así la entrega no depende de que el servidor consiga el dato en cada petición.
#
# El push a main REDESPLIEGA en Render, y eso es intencionado: el backend lee
# flags.json una sola vez al arrancar, así que el despliegue es el mecanismo de
# entrega de las banderas nuevas. Para que ese arranque no le cueste al primer
# usuario el fan-out completo a los proveedores, en el mismo commit viaja
# regions/cantabria/snapshot.json con el agregado ya calculado (ver build-snapshot.ts).

on:
  # Al desplegar (push a main) refrescamos las banderas para que producción no
  # tenga que esperar al siguiente disparo del cron. Fuera de horario de vigilancia
  # el scrape devuelve "No hay información" y scrape-flags.ts NO sobrescribe (0
  # banderas con color), así que es seguro. El auto-commit lleva "[skip ci]", que
  # GitHub respeta para no reencadenar este workflow (sin bucle).
  push:
    branches: [main]
  schedule:
    # Cruz Roja iza bandera en horario de vigilancia (11:30–19:30 Madrid, a diario,
    # en temporada de verano). Scrapeamos CADA HORA a :30 durante toda la franja para
    # reflejar cambios de bandera cuanto antes.
    # Optimizado para VERANO (CEST = UTC+2). Empieza a las 07:30 UTC (09:30 Madrid),
    # DOS HORAS ANTES del izado, y no por despiste: medido sobre las pasadas reales,
    # GitHub descarta la mayoría de los disparos programados y los que ejecuta llegan
    # con 1,5–2 h de retraso. Con el inicio a las 09:30 Madrid, la primera pasada
    # aterrizaba hacia las 13:00 y las banderas de la mañana se perdían. Adelantando
    # el arranque, el retraso juega a favor: retrasada cae en el izado, y puntual es
    # un no-op inofensivo (sin banderas izadas no se sobrescribe nada).
    # En invierno (CET = UTC+1) sería 08:30–18:30 Madrid, pero fuera de temporada no
    # hay banderas izadas, así que esas pasadas también son no-op.
    - cron: '30 7-17 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-flags
  cancel-in-progress: false

jobs:
  # Only the regions that declare a flag operator. A region without one has
  # nothing to scrape, and iterating it would just push empty commits.
  regiones:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.detectar.outputs.lista }}
      hay: ${{ steps.detectar.outputs.hay }}
    steps:
      - uses: actions/checkout@v4
      - id: detectar
        run: |
          set -euo pipefail
          lista=$(find regions -mindepth 2 -maxdepth 2 -name region.json -print0             | xargs -0 -n1 jq -r 'select((.flagProviders // []) | length > 0) | .id'             | sort | jq -R . | jq -sc .)
          echo "lista=$lista" >> "$GITHUB_OUTPUT"
          echo "hay=$([ "$lista" = "[]" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "Regions with a flag operator: $lista"

  scrape:
    needs: regiones
    if: needs.regiones.outputs.hay == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One region's failure must not stop the others from delivering flags.
      fail-fast: false
      # Serialised: every job pushes to main, and in parallel they would reject
      # each other. Flags are not urgent to the second; a clean push is.
      max-parallel: 1
      matrix:
        region: ${{ fromJson(needs.regiones.outputs.lista) }}
    env:
      REGION: ${{ matrix.region }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Scrape flags
        run: npm run scrape:flags

      # Precalcula el agregado de /featured con las banderas recién scrapeadas.
      # El backend lo siembra al arrancar, así que el primer usuario tras un
      # despliegue (o tras el dormido de Render free) no paga el fan-out de ~200
      # peticiones a proveedores. Si faltan las claves, el script aborta solo y
      # conserva el snapshot anterior: por eso `continue-on-error`.
      - name: Build cache snapshot
        continue-on-error: true
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: npm run build:snapshot

      # `!cancelled()`, no el salto por defecto: cuando el scrape sale en rojo
      # —justo el día que hay que explicar— este paso se saltaba y el diagnóstico
      # se quedaba en el log de Actions, que hace falta autenticarse para leer.
      # Con flags.json sin tocar, aquí sólo sube `flags-diag.json`, y el job sigue
      # en rojo porque quien falló fue el paso del scrape.
      - name: Commit flags.json / snapshot.json / flags-diag.json if changed
        if: ${{ !cancelled() }}
        run: |
          RUTAS=("../regions/${REGION}/flags.json" "../regions/${REGION}/snapshot.json" "../regions/${REGION}/flags-diag.json")
          if [[ -n "$(git status --porcelain "${RUTAS[@]}")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # `if`, no `[[ ... ]] && ...`: con `set -e` (el shell de Actions) un
            # `&&` que evalúa a falso aborta el step, y entonces ni las banderas
            # se commitearían. El snapshot puede no existir si faltan las claves,
            # y flags.json tampoco si la pasada decidió no sobrescribirlo.
            for ruta in "${RUTAS[@]}"; do
              if [[ -f "$ruta" ]]; then
                git add "$ruta"
              fi
            done
            git commit -m "chore(flags): actualizar banderas ${REGION} [skip ci]"
            # Otro job de la matriz puede haber empujado mientras tanto.
            git pull --rebase
            git push
          else
            echo "Sin cambios en flags.json, snapshot.json ni flags-diag.json"
          fi

  # Para fallos DEL JOB: npm ci, red, o que la mayoría de fichas no conteste. Que
  # no haya banderas izadas NO llega aquí —eso sale en verde y lo vigila
  # `flags-freshness`—, y por eso comparte título con aquel: es la misma
  # incidencia mirada desde otro sitio, y así son un aviso y no dos.
  avisar:
    needs: scrape
    if: failure()
    uses: ./.github/workflows/alerta-issue.yml
    permissions:
      issues: write
    with:
      titulo: 'Banderas: la cadena de entrega está caída'
      cuerpo: |
        El scrape de Cruz Roja ha fallado. `regions/<region>/flags-diag.json` —que
        se sube también cuando el job sale en rojo— lleva los `alt` recibidos y los
        estados HTTP: distinguen un «No hay información» de verdad de una respuesta
        que simplemente vino sin el dato.

        `flags.json` NO se ha sobrescrito: la app sigue con la última captura buena
        hasta que cumpla 8 h.
